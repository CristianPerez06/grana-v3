<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero section</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">HeroSection</p>
        <section class="card hero">
          <div class="card-pad">
            <div class="hero-main">
              <div class="eyebrow">Para gastar · hoy</div>
              <div class="hero-ars">$ 2.454.499<span class="dec">,75</span></div>
              <div class="hero-usd">
                <span class="pill usd">USD</span>
                <span class="hero-usd-value">US$ 1.240,00</span>
              </div>
            </div>
            <p class="hero-caption">Lo que tenés disponible hoy, en pesos y dólares.</p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
