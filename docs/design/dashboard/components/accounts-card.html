<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accounts card</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">AccountsCard</p>
        <section class="card">
          <div class="card-header">
            <h2>Dónde está</h2>
            <a class="text-link" href="#">Ver todas</a>
          </div>
          <div class="account-list">
            <div class="account-row">
              <span class="avatar">$</span>
              <span class="account-name">Billetera</span>
              <span class="amount">$ 1.254.499,75</span>
            </div>
            <div class="account-row">
              <span class="avatar bank">G</span>
              <span class="account-name">Caja de ahorro Galicia sueldo y gastos del hogar</span>
              <span class="amount">$ 1.200.000,00</span>
            </div>
            <div class="account-row">
              <span class="avatar slate">C</span>
              <span class="account-name">Cooperativa ahorros</span>
              <span class="amount muted">$ 0,00</span>
            </div>
            <div class="usd-row">
              <span class="usd-dot"></span>
              <span class="account-name">En dólares</span>
              <span class="amount">US$ 1.240,00</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
