<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Month balance section</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">MonthBalanceSection</p>
        <section class="card">
          <div class="card-header">
            <h2>Balance del mes</h2>
            <span class="net-note">vas <strong>+$ 504.499,75</strong> este mes</span>
          </div>
          <div class="balance-body">
            <p class="balance-kicker">Balance</p>
            <div class="balance-net">+$ 504.499<span class="dec">,75</span></div>
            <div class="flow-list">
              <div>
                <div class="flow-head">
                  <span class="flow-label"><span class="usd-dot income"></span>Ingresos</span>
                  <span class="amount">$ 800.000,00</span>
                </div>
                <div class="flow-track"><div class="flow-bar income" style="width: 100%"></div></div>
              </div>
              <div>
                <div class="flow-head">
                  <span class="flow-label"><span class="usd-dot expense"></span>Gastos</span>
                  <span class="amount">$ 295.500,25</span>
                </div>
                <div class="flow-track"><div class="flow-bar expense" style="width: 37%"></div></div>
              </div>
            </div>
            <div class="usd-strip">
              <span class="pill">USD</span>
              <strong>+US$ 140,00</strong>
              <span>Ingresos US$ 150,00 · Gastos US$ 10,00</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
