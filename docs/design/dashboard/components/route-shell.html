<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard route shell</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench shell">
        <p class="workbench-title">DashboardLayout + DashboardContent</p>
        <header class="header">
          <div>
            <h1>Hola, Cristian</h1>
            <div class="lens-row">
              <button class="month-lens" type="button" aria-haspopup="dialog" aria-label="Cambiar el mes">
                Domingo 7 de junio<span class="caret" aria-hidden="true">▾</span>
              </button>
            </div>
          </div>
          <div class="header-actions">
            <button class="button desktop-only">+ Nuevo movimiento</button>
          </div>
        </header>
        <div class="grid">
          <div class="top-grid">
            <div class="card hero"><div class="card-pad"></div></div>
            <div class="card"><div style="height:220px"></div></div>
          </div>
          <div class="card"><div style="height:260px"></div></div>
          <div class="card"><div style="height:260px"></div></div>
        </div>
      </div>
    </main>
  </body>
