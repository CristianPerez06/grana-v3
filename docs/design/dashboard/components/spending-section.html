<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spending section</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">SpendingSection</p>
        <section class="card">
          <div class="card-header">
            <h2>En qué se fue</h2>
            <div class="card-actions">
              <a class="text-link" href="#">Ver desglose</a>
              <div class="segmented" aria-label="Moneda">
                <button class="active" type="button">ARS</button>
                <button type="button">USD</button>
              </div>
            </div>
          </div>
          <div class="spending-body">
            <div class="donut">
              <div class="donut-center">
                <span>Gastos</span>
                <strong>$ 295.500</strong>
              </div>
            </div>
            <div class="legend">
              <a class="legend-row" href="#"><span class="legend-dot" style="background: var(--amber)"></span><span class="legend-name">Comida</span><span class="amount">$ 112.300</span><span class="legend-percent">38%</span></a>
              <a class="legend-row" href="#"><span class="legend-dot" style="background: var(--slate)"></span><span class="legend-name">Servicios del departamento</span><span class="amount">$ 68.400</span><span class="legend-percent">23%</span></a>
              <a class="legend-row" href="#"><span class="legend-dot" style="background: var(--violet)"></span><span class="legend-name">Transporte</span><span class="amount">$ 43.200</span><span class="legend-percent">15%</span></a>
              <a class="legend-row" href="#"><span class="legend-dot" style="background: var(--emerald)"></span><span class="legend-name">Súper</span><span class="amount">$ 41.600</span><span class="legend-percent">14%</span></a>
              <a class="legend-row" href="#"><span class="legend-dot" style="background: var(--rose)"></span><span class="legend-name">Salud</span><span class="amount">$ 30.000</span><span class="legend-percent">10%</span></a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
