<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard header</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">DashboardHeader</p>
        <header class="header">
          <div>
            <h1>Hola, Cristian</h1>
            <div class="lens-row">
              <button class="month-lens" type="button" aria-haspopup="dialog" aria-label="Cambiar el mes">
                Domingo 7 de junio<span class="caret" aria-hidden="true">▾</span>
              </button>
            </div>
          </div>
          <div class="header-actions">
            <button class="button desktop-only" type="button">+ Nuevo movimiento</button>
          </div>
        </header>

        <p class="workbench-title" style="margin-top: 28px">DashboardHeader · parado en otro mes</p>
        <header class="header">
          <div>
            <h1>Hola, Cristian</h1>
            <div class="lens-row">
              <button class="month-lens" type="button" aria-haspopup="dialog" aria-label="Cambiar el mes">
                Mayo 2026<span class="caret" aria-hidden="true">▾</span>
              </button>
              <button class="back-to-today" type="button">Volver a hoy</button>
            </div>
          </div>
          <div class="header-actions">
            <button class="button desktop-only" type="button">+ Nuevo movimiento</button>
          </div>
        </header>
      </div>
    </main>
  </body>
</html>
