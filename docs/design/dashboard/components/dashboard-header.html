<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard header</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">DashboardHeader</p>
        <header class="header">
          <div>
            <h1>Hola, Cristian</h1>
            <p>Domingo 7 de junio</p>
          </div>
          <div class="header-actions">
            <div class="month-nav" aria-label="Selector de mes">
              <button type="button" aria-label="Mes anterior">‹</button>
              <span>Junio 2026</span>
              <button type="button" aria-label="Mes siguiente">›</button>
            </div>
            <button class="icon-button" type="button" aria-label="Ocultar importes">◐</button>
            <button class="button desktop-only" type="button">+ Nuevo movimiento</button>
          </div>
        </header>
      </div>
    </main>
  </body>
</html>
