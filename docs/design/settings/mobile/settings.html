<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Configuracion mobile</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="phone-stage">
      <div class="phone">
        <div class="phone-screen shell">
          <header><h1 class="title">Configuracion</h1></header>
          <div class="settings-grid">
            <section class="section"><h2 class="section-title">Visualizacion</h2><div class="panel"><div class="row"><div class="row-copy"><strong>Mostrar centavos</strong><span>Define si los importes se muestran con decimales.</span></div><button class="switch" type="button"></button></div></div></section>
            <section class="section"><h2 class="section-title">Idioma</h2><div class="panel"><div class="row"><div class="row-copy"><strong>Idioma</strong><span>Selecciona el idioma de la app.</span></div><div class="segmented"><button class="active" type="button">ES</button><button type="button">EN</button></div></div></div></section>
            <section class="section"><h2 class="section-title">Categorias</h2><div class="panel"><div class="row"><div class="row-copy"><strong>Administrar categorias</strong><span>Categorias y subcategorias.</span></div><span class="chevron">›</span></div></div></section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
