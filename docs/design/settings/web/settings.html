<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Configuracion</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="stage">
      <div class="route shell">
        <header class="header"><h1 class="title">Configuracion</h1></header>
        <div class="settings-grid">
          <section class="section">
            <h2 class="section-title">Visualizacion</h2>
            <div class="panel">
              <div class="row">
                <div class="row-copy"><strong>Mostrar centavos</strong><span>Define si los importes se muestran con decimales.</span></div>
                <button class="switch" type="button" role="switch" aria-checked="true"></button>
              </div>
            </div>
          </section>
          <section class="section">
            <h2 class="section-title">Idioma</h2>
            <div class="panel">
              <div class="row">
                <div class="row-copy"><strong>Idioma de la aplicacion</strong><span>Se aplica a textos y formatos disponibles.</span></div>
                <div class="segmented" role="radiogroup"><button class="active" type="button">Español</button><button type="button">English</button></div>
              </div>
            </div>
          </section>
          <section class="section">
            <h2 class="section-title">Categorias</h2>
            <div class="panel">
              <div class="row">
                <div class="row-copy"><strong>Administrar categorias</strong><span>Edita categorias y subcategorias personalizadas.</span></div>
                <span class="chevron">›</span>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
