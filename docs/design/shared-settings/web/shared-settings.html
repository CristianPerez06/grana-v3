<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Configuracion compartido</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="stage">
      <div class="route shell">
        <header class="header">
          <a class="back-link" href="#">‹ Compartido</a>
          <h1 class="title">Configuracion</h1>
        </header>
        <div class="form-shell">
          <section class="section">
            <h2 class="section-title">Nombre</h2>
            <div class="panel panel-pad">
              <div class="field-row">
                <label class="field"><span class="label">Nombre del hogar</span><input class="input" value="Casa" /></label>
                <button class="button secondary small" type="button">OK</button>
              </div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">Integrantes</h2>
            <div class="panel">
              <ul class="member-list">
                <li class="member-row"><div class="member-main"><span class="avatar">CP</span><span class="member-name">Cristian</span></div><span class="badge creator">Creador</span></li>
                <li class="member-row"><div class="member-main"><span class="avatar">A</span><span class="member-name">Ana</span></div><span class="badge">Miembro</span></li>
              </ul>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">Reparto por defecto</h2>
            <p class="section-hint">Se usa como base cuando registres gastos compartidos nuevos.</p>
            <div class="panel panel-pad">
              <div class="split-row">
                <div class="split-person"><strong>Cristian</strong><span>Primer integrante</span></div>
                <input class="input percent" type="number" value="50" />
                <div class="split-person"><strong>Ana</strong><span>Complementario</span></div>
                <span class="split-mirror">50%</span>
                <button class="button secondary small" type="button">OK</button>
              </div>
            </div>
          </section>

          <section class="section danger-zone">
            <h2 class="section-title">Salir del hogar</h2>
            <div class="panel danger-panel panel-pad">
              <p>Esta accion te saca del hogar compartido actual.</p>
              <div style="margin-top:12px"><button class="button destructive" type="button">Salir del hogar</button></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
