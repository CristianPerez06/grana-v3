<!doctype html><html lang="es"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Default split edit drawer</title></head><body><main class="stage"><section class="section workbench"><p class="workbench-title">Default split drawer trigger state</p><h2 class="section-title">Reparto por defecto</h2><div class="panel panel-pad"><div class="setting-row"><div class="setting-copy"><strong>Reparto base</strong><div class="split-summary"><div class="split-chip"><strong>Cristian</strong><span>50%</span></div><div class="split-chip"><strong>Ana</strong><span>50%</span></div></div></div><button class="button secondary small" type="button">Editar</button></div></div></section><div class="scrim"><aside class="drawer"><div class="drawer-head"><div><p class="drawer-eyebrow">Compartido</p><h2 class="drawer-title">Editar reparto</h2></div><button class="close-button" type="button">×</button></div><div class="drawer-body"><p class="section-hint">Edita el porcentaje del primer integrante. El segundo se calcula automaticamente.</p><div class="split-row"><div class="split-person"><strong>Cristian</strong><span>Primer integrante</span></div><input class="input percent" type="number" value="50" /><div class="split-person"><strong>Ana</strong><span>Complementario</span></div><span class="split-mirror">50%</span></div></div><div class="drawer-foot"><button class="button secondary" type="button">Cancelar</button><button class="button" type="button">Guardar</button></div></aside></div></main></body></html>
