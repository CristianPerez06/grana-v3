<!doctype html><html lang="es"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Change password form</title></head><body><main class="stage"><div class="workbench">
<p class="workbench-title">Estado limpio</p>
<form class="form" style="margin-bottom:32px">
  <div class="field"><label>Contrasena actual</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <div class="field"><label>Nueva contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <div class="field"><label>Confirmar contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <button class="submit" type="button">Guardar contrasena</button>
</form>
<p class="workbench-title">Error de campo — la contrasena actual es incorrecta (invalid_credentials)</p>
<form class="form" style="margin-bottom:32px">
  <div class="field"><label>Contrasena actual</label><div class="input-wrap"><input class="input invalid" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div><span class="field-error">La contrasena es incorrecta.</span></div>
  <div class="field"><label>Nueva contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <div class="field"><label>Confirmar contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <button class="submit" type="button">Guardar contrasena</button>
</form>
<p class="workbench-title">Error de formulario — same_password / weak_password / rate limit</p>
<form class="form">
  <div class="field"><label>Contrasena actual</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <div class="field"><label>Nueva contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <div class="field"><label>Confirmar contrasena</label><div class="input-wrap"><input class="input" type="password" placeholder="••••••••" /><button class="eye" type="button" aria-label="Ver contrasena">◉</button></div></div>
  <p class="form-error">La contrasena nueva tiene que ser distinta de la actual.</p>
  <button class="submit" type="button">Guardar contrasena</button>
</form>
</div></main></body></html>
