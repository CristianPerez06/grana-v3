<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Categorias mobile</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="phone-stage">
      <div class="phone">
        <div class="phone-screen shell">
          <header class="header"><div class="header-copy"><h1 class="title">Categorias</h1><p class="description">Administra categorias y subcategorias.</p></div><button class="button" type="button">+ Agregar</button></header>
          <div class="sections">
            <section class="section">
              <div class="section-head"><h2 class="section-title">Sistema</h2><span class="section-count">18</span></div>
              <div class="panel">
                <article class="category-row"><div class="category-main"><span class="category-icon" style="background:#d95f3d1a">🛒</span><div class="category-copy"><div class="category-top"><strong class="category-name">Supermercado</strong><span class="pill expense">Egreso</span></div><span class="meta">4 subcategorias</span></div></div><button class="icon-button action-menu" type="button">⋯</button></article>
                <article class="category-row"><div class="category-main"><span class="category-icon" style="background:#10b9811a">↙</span><div class="category-copy"><div class="category-top"><strong class="category-name">Ingresos laborales</strong><span class="pill income">Ingreso</span></div><span class="meta">2 subcategorias</span></div></div><button class="icon-button action-menu" type="button">⋯</button></article>
              </div>
            </section>
            <section class="section"><div class="section-head"><h2 class="section-title">Propias</h2><span class="section-count">2</span></div><div class="panel"><article class="category-row"><div class="category-main"><span class="category-icon" style="background:#3a6b8a1a">🎓</span><div class="category-copy"><div class="category-top"><strong class="category-name">Cursos y formacion profesional</strong><span class="pill expense">Egreso</span></div><span class="meta">3 subcategorias</span></div></div><button class="icon-button action-menu" type="button">⋯</button></article></div></section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
