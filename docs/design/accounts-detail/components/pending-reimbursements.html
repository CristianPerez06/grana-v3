<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pending reimbursements</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="route narrow">
        <section class="pending-block">
          <div class="pending-head">
            <h1>Reintegros a confirmar</h1>
            <span class="pending-count">1 pendiente</span>
          </div>
          <div class="pending-list">
            <article class="pending-item">
              <div class="pending-top">
                <div class="movement-main">
                  <span class="cat">%</span>
                  <div>
                    <div class="mov-title">Promo supermercado</div>
                    <div class="mov-meta">Cuenta · BBVA sueldo</div>
                  </div>
                </div>
                <strong class="pending-amount">+$ 7.500</strong>
              </div>
              <div class="pending-form">
                <div class="field">
                  <label>Monto real</label>
                  <input class="input" value="7500" />
                </div>
                <div class="field">
                  <label>Fecha real</label>
                  <input class="input" value="2026-06-06" />
                </div>
                <button class="button small">Confirmar</button>
                <button class="button secondary small">Cancelar</button>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
