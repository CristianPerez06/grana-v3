<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movement list</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="route narrow">
        <section class="ledger">
          <div class="day">
            <p class="day-label">Hoy</p>
            <div class="movement">
              <div class="movement-main">
                <span class="cat">$</span>
                <div>
                  <div class="mov-title">Supermercado</div>
                  <div class="mov-meta">Alimentos · Mercado</div>
                </div>
              </div>
              <div class="amount negative">- $ 42.850</div>
              <div class="running">$ 1.284.900</div>
            </div>
            <div class="movement">
              <div class="movement-main">
                <span class="cat">+</span>
                <div>
                  <div class="mov-title">Reintegro promo banco</div>
                  <div class="mov-meta">Reintegro recibido</div>
                </div>
              </div>
              <div class="amount positive">+ $ 7.500</div>
              <div class="running">$ 1.327.750</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
