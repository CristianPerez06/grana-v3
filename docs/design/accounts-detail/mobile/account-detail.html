<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grana - Mobile account detail</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="native-stage">
      <section class="native-phone">
        <header class="native-safe">
          <span class="back">← Cuentas</span>
          <div class="identity-row">
            <div class="identity">
              <span class="avatar">BI</span>
              <div>
                <h1>Billetera</h1>
                <p>Efectivo</p>
              </div>
            </div>
            <span class="icon-button" aria-label="Editar">✎</span>
          </div>
          <div class="phone-balance">$ 86.450</div>
          <div class="phone-usd">US$ 120,00</div>
          <div class="quick-actions">
            <button>Agregar transaccion</button>
            <button>Filtros</button>
          </div>
        </header>

        <div class="native-content">
          <section class="phone-card">
            <h2 style="margin: 0; font-size: 15px">Reintegros a confirmar</h2>
            <div class="phone-row">
              <div>
                <div class="mov-title">Promo supermercado</div>
                <div class="mov-meta">Cuenta · Billetera</div>
              </div>
              <strong class="pending-amount">+$ 7.500</strong>
            </div>
            <div class="pending-form">
              <button class="button small">Confirmar</button>
              <button class="button secondary small">Cancelar</button>
            </div>
          </section>

          <span class="add-currency" style="margin: 0 0 12px 2px">+ Agregar moneda</span>

          <section class="phone-card">
            <div class="phone-toolbar">
              <h2 style="margin: 0; font-size: 15px">Movimientos</h2>
              <span class="month-nav">Junio 2026</span>
            </div>
            <div class="chips" style="border-bottom: 0; padding: 12px 0 0">
              <span class="pill">Buscar</span>
              <span class="pill">Recurrencias</span>
              <span class="pill">Filtros</span>
            </div>
            <div class="phone-row">
              <div>
                <div class="mov-title">Verduleria</div>
                <div class="mov-meta">Hoy · Alimentos</div>
              </div>
              <strong class="amount negative">- $ 6.400</strong>
            </div>
            <div class="phone-row">
              <div>
                <div class="mov-title">Saldo inicial</div>
                <div class="mov-meta">1 jun</div>
              </div>
              <strong>$ 92.850</strong>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
