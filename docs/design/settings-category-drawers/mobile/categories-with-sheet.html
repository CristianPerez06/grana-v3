<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Categorias sheet</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="phone-stage">
      <div class="phone">
        <div class="phone-screen shell">
          <header class="header"><div class="header-copy"><h1 class="title">Categorias</h1><p class="description">Administra categorias y subcategorias.</p></div><button class="button" type="button">+ Agregar</button></header>
          <section class="section"><div class="section-head"><h2 class="section-title">Propias</h2><span class="section-count">2</span></div><div class="panel"><article class="category-row"><div class="category-main"><span class="category-icon" style="background:#3a6b8a1a">🎓</span><div class="category-copy"><div class="category-top"><strong class="category-name">Cursos y formacion profesional</strong><span class="pill expense">Egreso</span></div><span class="meta">3 subcategorias</span></div></div><button class="icon-button" type="button">⋯</button></article></div></section>
          <div class="scrim"><aside class="drawer"><div class="drawer-head"><div><p class="drawer-eyebrow">Categorias</p><h2 class="drawer-title">Nueva categoria</h2></div><button class="close-button" type="button">×</button></div><div class="drawer-body"><label class="field"><span class="label">Nombre</span><input class="input" placeholder="Ej. Cursos" /></label><div class="field"><span class="label">Tipo</span><div class="type-grid"><button class="type-option active" type="button">Egreso</button><button class="type-option" type="button">Ingreso</button><button class="type-option" type="button">Ambos</button></div></div><label class="field"><span class="label">Icono</span><input class="input" placeholder="🎓" /></label><label class="field"><span class="label">Color</span><input class="input" placeholder="#3B82F6" /></label></div><div class="drawer-foot"><button class="button secondary" type="button">Cancelar</button><button class="button" type="button">Crear categoria</button></div></aside></div>
        </div>
      </div>
    </main>
  </body>
</html>
