<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Grana - Subcategorias sheet</title><link rel="stylesheet" href="../shared.css" /></head>
  <body>
    <main class="phone-stage">
      <div class="phone">
        <div class="phone-screen shell">
          <a class="back-link" href="#">← Categorias</a>
          <header class="header"><div class="header-copy"><h1 class="title">Supermercado · Subcategorias</h1></div><button class="button" type="button">+ Agregar</button></header>
          <section class="panel"><article class="subcategory-row"><div class="subcategory-copy"><strong class="subcategory-name">Verduleria del barrio</strong><span class="meta">Propia</span></div><button class="icon-button" type="button">⋯</button></article></section>
          <div class="scrim"><aside class="drawer"><div class="drawer-head"><div><p class="drawer-eyebrow">Supermercado</p><h2 class="drawer-title">Nueva subcategoria</h2></div><button class="close-button" type="button">×</button></div><div class="drawer-body"><label class="field"><span class="label">Nombre</span><input class="input" placeholder="Ej. Verduleria" /></label></div><div class="drawer-foot"><button class="button secondary" type="button">Cancelar</button><button class="button" type="button">Crear subcategoria</button></div></aside></div>
        </div>
      </div>
    </main>
  </body>
</html>
