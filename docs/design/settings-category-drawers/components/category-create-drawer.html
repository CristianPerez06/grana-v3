<!doctype html><html lang="es"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Create category drawer</title></head><body><main class="stage"><div class="scrim"><aside class="drawer"><div class="drawer-head"><div><p class="drawer-eyebrow">Categorias</p><h2 class="drawer-title">Nueva categoria</h2></div><button class="close-button" type="button">×</button></div><div class="drawer-body"><label class="field"><span class="label">Nombre</span><input class="input" placeholder="Ej. Cursos" /></label><div class="field"><span class="label">Tipo</span><div class="type-grid"><button class="type-option active" type="button">Egreso</button><button class="type-option" type="button">Ingreso</button><button class="type-option" type="button">Ambos</button></div></div><div class="field"><span class="label">Icono</span><div class="emoji-grid"><button class="emoji" type="button">🍔</button><button class="emoji" type="button">🛒</button><button class="emoji" type="button">🎓</button><button class="emoji" type="button">🏠</button><button class="emoji" type="button">💊</button><button class="emoji" type="button">💰</button></div></div><div class="field"><span class="label">Color</span><div class="swatches"><span class="swatch" style="background:#EF4444"></span><span class="swatch" style="background:#F97316"></span><span class="swatch" style="background:#10B981"></span><span class="swatch" style="background:#3B82F6"></span></div></div></div><div class="drawer-foot"><button class="button secondary" type="button">Cancelar</button><button class="button" type="button">Crear categoria</button></div></aside></div></main></body></html>
