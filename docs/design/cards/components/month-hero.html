<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards month hero</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">CardsMonthHero</p>
        <section class="card month-hero">
          <div class="hero-main">
            <div class="eyebrow">A pagar este mes</div>
            <div>
              <div class="hero-amount">$ 328.500<span class="dec">,00</span></div>
              <div class="hero-usd">US$ 240,00</div>
            </div>
            <div class="next-due"><span>Próximo vencimiento</span><strong>Visa Galicia · vence 12/06</strong></div>
          </div>
          <div class="divider" aria-hidden="true"></div>
          <div class="upcoming">
            <h2>Próximos vencimientos</h2>
            <div class="due-row"><div class="date-chip"><strong>12</strong><span>jun</span></div><div class="due-copy"><strong>Visa Galicia principal</strong><span>vence 12/06</span></div><div class="amount">$ 228.500<span class="usd">US$ 240</span></div></div>
            <div class="due-row"><div class="date-chip"><strong>18</strong><span>jun</span></div><div class="due-copy"><strong>Master BBVA gastos del hogar</strong><span>cierra 18/06</span></div><div class="amount">$ 100.000</div></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
