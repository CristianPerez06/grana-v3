<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallet card</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">WalletCard / CreditCardItem</p>
        <a class="card wallet-card" href="#" style="--accent: var(--visa)">
          <div class="wallet-card-head">
            <span class="avatar">V</span>
            <div class="wallet-title"><strong>Visa Galicia principal</strong><span>Crédito · Visa</span></div>
            <span class="pill danger">A pagar</span>
          </div>
          <div class="stats">
            <div><span class="stat-label">Resumen junio</span><strong class="stat-value">$ 228.500</strong><span class="stat-value secondary">US$ 240</span></div>
            <div><span class="stat-label">Cierra</span><strong class="stat-value">28/06</strong></div>
            <div><span class="stat-label">Vence</span><strong class="stat-value">12/06</strong></div>
          </div>
          <div class="limit"><div class="limit-row"><span>Límite usado $ 228.500 de $ 900.000</span><strong>25%</strong></div><div class="bar"><span style="width:25%"></span></div></div>
          <div class="wallet-footer"><span>2 compras en cuotas</span><span>Ver resumen ›</span></div>
        </a>
      </div>
    </main>
  </body>
</html>
