<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archived accounts section</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">ArchivedAccountsContainer + AccountSection</p>
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Archivadas</h2>
            <span class="section-count">· 1</span>
          </div>
          <div class="account-list archived">
            <article class="account-row">
              <div class="avatar slate" aria-hidden="true">S</div>
              <a class="row-link" href="#">
                <div class="row-copy">
                  <div class="row-title-line">
                    <span class="row-title">Santander vieja</span>
                    <span class="badge">Archivada</span>
                  </div>
                  <div class="row-meta">Santander</div>
                </div>
                <div class="balances">
                  <span class="ars">$ 0,00</span>
                  <span class="usd">US$ 0,00</span>
                </div>
              </a>
              <button class="menu-button" type="button" aria-label="Acciones de la cuenta">⋮</button>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
