<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Route shell</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench shell">
        <p class="workbench-title">Route shell</p>
        <header class="header">
          <h1 class="title">Cuentas</h1>
          <button class="button" type="button"><span class="icon">+</span>Crear cuenta</button>
        </header>
        <div class="sections">
          <div class="active-block">
            <section class="section">
              <div class="section-head">
                <h2 class="section-title">Efectivo</h2>
                <span class="section-count">· 1</span>
              </div>
              <div class="account-list"></div>
            </section>
          </div>
          <section class="section">
            <div class="section-head">
              <h2 class="section-title">Archivadas</h2>
              <span class="section-count">· 1</span>
            </div>
            <div class="account-list archived"></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
