<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account row</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench">
        <p class="workbench-title">AccountRow</p>
        <div class="account-list">
          <article class="account-row">
            <div class="avatar bank" aria-hidden="true">G</div>
            <a class="row-link" href="#">
              <div class="row-copy">
                <div class="row-title-line">
                  <span class="row-title">Caja de ahorro Galicia sueldo y gastos del hogar</span>
                </div>
                <div class="row-meta">Banco Galicia</div>
              </div>
              <div class="balances" aria-label="Saldo">
                <span class="ars">$ 1.840.300,50</span>
                <span class="usd">US$ 1.240,00</span>
              </div>
            </a>
            <button class="menu-button" type="button" aria-label="Acciones de la cuenta">⋮</button>
          </article>
          <article class="account-row">
            <div class="avatar slate" aria-hidden="true">S</div>
            <a class="row-link" href="#">
              <div class="row-copy">
                <div class="row-title-line">
                  <span class="row-title">Santander cuenta sueldo anterior archivada</span>
                  <span class="badge">Archivada</span>
                </div>
                <div class="row-meta">Santander</div>
              </div>
              <div class="balances" aria-label="Saldo">
                <span class="ars">$ 100.000,00</span>
                <span class="usd">US$ 0,00</span>
              </div>
            </a>
            <button class="menu-button" type="button" aria-label="Acciones de la cuenta">⋮</button>
          </article>
        </div>
      </div>
    </main>
  </body>
</html>
