<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Active accounts section</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="stage">
      <div class="workbench active-block">
        <p class="workbench-title">ActiveAccountsContainer + AccountSection</p>
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Efectivo</h2>
            <span class="section-count">· 1</span>
          </div>
          <div class="account-list">
            <article class="account-row">
              <div class="avatar" aria-hidden="true">$</div>
              <a class="row-link" href="#">
                <div class="row-copy">
                  <div class="row-title-line">
                    <span class="row-title">Billetera</span>
                  </div>
                  <div class="row-meta">Efectivo</div>
                </div>
                <div class="balances">
                  <span class="ars">$ 128.450,00</span>
                  <span class="usd">US$ 520,00</span>
                </div>
              </a>
              <button class="menu-button" type="button" aria-label="Acciones de la cuenta">⋮</button>
            </article>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Cuentas bancarias</h2>
            <span class="section-count">· 2</span>
          </div>
          <div class="account-list">
            <article class="account-row">
              <div class="avatar bank" aria-hidden="true">G</div>
              <a class="row-link" href="#">
                <div class="row-copy">
                  <div class="row-title-line">
                    <span class="row-title">Caja de ahorro Galicia</span>
                  </div>
                  <div class="row-meta">Banco Galicia</div>
                </div>
                <div class="balances">
                  <span class="ars">$ 840.300,50</span>
                  <span class="usd">US$ 1.240,00</span>
                </div>
              </a>
              <button class="menu-button" type="button" aria-label="Acciones de la cuenta">⋮</button>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
