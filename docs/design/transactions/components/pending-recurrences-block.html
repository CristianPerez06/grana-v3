<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Pending recurrences</title></head>
  <body>
    <main class="stage">
      <section class="card pending workbench">
        <p class="workbench-title" style="padding:18px 22px 0">PendingRecurrencesBlock</p>
        <div class="pending-head">
          <span class="tile" style="background:var(--warning-soft);color:var(--warning)">◷</span>
          <div><h2>Recurrencias pendientes</h2><p>Confirma, edita o salta lo que toca registrar.</p></div>
          <span class="count-pill">2</span>
        </div>
        <ul class="pending-list">
          <li class="pending-row">
            <span class="tile" style="background:#d95f3d1a">🏠</span>
            <div><strong>Alquiler</strong><span class="meta">Mensual · Banco Galicia</span><span class="urgency">Vence hoy</span></div>
            <span class="amount">- $ 280.000,00</span>
            <div class="inline-actions" style="grid-column:2 / -1"><button class="small-button" type="button">Confirmar</button><button class="small-button secondary" type="button">Saltar</button></div>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
