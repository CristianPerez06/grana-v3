<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Filter sheet</title></head>
  <body>
    <main class="stage">
      <aside class="card card-pad workbench">
        <p class="workbench-title">MovementFilters sheet</p>
        <div class="section-head"><div><p class="section-title">Refinar</p><h2 style="margin:4px 0 0">Filtros</h2></div><button class="icon-button" type="button">×</button></div>
        <div style="display:grid;gap:14px;margin-top:18px">
          <select class="mini-input" style="width:100%" aria-label="Tipo"><option>Todos los tipos</option></select>
          <select class="mini-input" style="width:100%" aria-label="Categoria"><option>Todas las categorias</option></select>
          <select class="mini-input" style="width:100%" aria-label="Cuenta"><option>Todas las cuentas</option></select>
          <select class="mini-input" style="width:100%" aria-label="Moneda"><option>ARS y USD</option></select>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input class="mini-input" style="width:100%" value="1000" /><input class="mini-input" style="width:100%" value="50000" /></div>
        </div>
        <div class="inline-actions" style="margin-top:18px"><button class="small-button secondary" type="button">Limpiar todo</button><button class="small-button" type="button">Aplicar</button></div>
      </aside>
    </main>
  </body>
</html>
