<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Movement toolbar</title></head>
  <body>
    <main class="stage">
      <section class="ledger workbench">
        <p class="workbench-title">MovementFilters toolbar</p>
        <div class="toolbar">
          <span class="toolbar-spacer"></span>
          <div class="tool-actions"><button class="icon-button" type="button" aria-label="Buscar">⌕</button><button class="icon-button" type="button" aria-label="Ver recurrencias">↻</button><button class="icon-button" type="button" aria-label="Filtros">☷</button></div>
        </div>
        <div class="active-chips"><button class="chip" type="button">ARS ×</button><button class="chip" type="button">Supermercado ×</button><button class="chip" type="button">Limpiar todo</button></div>
        <div class="search-bar"><span>⌕</span><input value="super" aria-label="Buscar" /><button class="small-button secondary" type="button">Cancelar</button></div>
      </section>
    </main>
  </body>
</html>
