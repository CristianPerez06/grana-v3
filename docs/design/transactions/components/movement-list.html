<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="stylesheet" href="../shared.css" /><title>Movement list</title></head>
  <body>
    <main class="stage">
      <section class="ledger workbench">
        <p class="workbench-title">MovementList</p>
        <div class="movement-card">
          <div class="day">Hoy</div>
          <article class="movement-row"><div class="movement-main"><span class="movement-icon" style="background:#d95f3d1a">🛒</span><div class="movement-copy"><div class="movement-badges"><strong class="movement-title">Compra semanal</strong><span class="badge">Recurrente</span></div><span class="meta">Supermercado · Billetera</span></div></div><div class="movement-amount"><strong>- $ 42.800,00</strong></div></article>
          <article class="movement-row"><div class="movement-main"><span class="movement-icon" style="background:#10b9811a">↙</span><div class="movement-copy"><div class="movement-badges"><strong class="movement-title">Sueldo</strong></div><span class="meta">Ingresos · Banco Galicia</span></div></div><div class="movement-amount"><strong class="income">+ $ 1.200.000,00</strong></div></article>
          <div class="day">Ayer</div>
          <article class="movement-row"><div class="movement-main"><span class="movement-icon" style="background:#3a6b8a1a">↔</span><div class="movement-copy"><div class="movement-badges"><strong class="movement-title">Transferencia a ahorros</strong></div><span class="meta">Billetera → Banco Galicia</span></div></div><div class="movement-amount"><strong class="income">$ 150.000,00</strong></div></article>
        </div>
      </section>
    </main>
  </body>
</html>
