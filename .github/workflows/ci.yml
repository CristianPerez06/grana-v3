# CI for grana-v3 monorepo (apps/web + apps/mobile + shared packages/).
# Runs on every PR targeting main + every push to main.
#
# Jobs run in parallel:
#   - quality        : eslint + tsc --noEmit for both apps
#   - web-build      : next build for apps/web with placeholder env
#   - web-test       : vitest tests for apps/web AND every package
#   - monorepo-health: pnpm-lock.yaml freshness + peer dep dedup + test timezone
#   - specs          : openspec master-spec validation + TBD placeholder gate
#                      + the generated workflow list stays at five
#
# Mobile builds (eas build) are NOT run from CI today — they consume
# EAS free-tier credits. Local validation (pnpm eas:android:local /
# eas:ios:local) is the current alternative. See PROXIMAS_FASES.md
# Phase 8c if/when we want CI-driven mobile builds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for PR updates (saves runner minutes).
# Never cancel on main pushes — we want every commit validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter web lint

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Next.js)
        env:
          # Placeholders so Next can complete static analysis. CI doesn't
          # hit Supabase, so real credentials aren't needed. If a future
          # build step requires valid values, switch to repo secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
        run: pnpm --filter web build

  # Corre TODO el monorepo, no solo `apps/web`. Mientras fue `--filter web`, los
  # 432 tests de los paquetes —donde vive la lógica de plata: saldos, ventanas de
  # resumen, los orquestadores de compra con tarjeta y de cuotas— estaban escritos
  # y no protegían nada: se podía romper `@grana/dashboard`, ver el verde y
  # mergear. Peor todavía, empujaba a escribir tests de paquetes bajo
  # `apps/web/lib/**` solo para que corrieran, torciendo dónde vive el código para
  # complacer a la config de CI.
  #
  # El job conserva su id y su nombre —`web-test` / "Web tests"— aunque ya no sea
  # solo web: el nombre del check es lo que la protección de `main` exige por
  # nombre, y renombrarlo dejó al check requerido esperando a alguien que ya no
  # se reportaba nunca, con el PR trabado y en verde a la vez. Lo que corre está
  # en el step; renombrar el job pide cambiar la regla PRIMERO, y recién después
  # el yml.
  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (vitest — web + packages)
        run: pnpm -r test

  # The spec is the memory of this project — lint, build, tests and the
  # lockfile are all guarded by CI, and until this job existed the specs
  # were the only artifact with no automated gate. Enforcement lives here
  # rather than in a local pre-merge step because the local run depends on
  # someone remembering to do it *and* reporting the result honestly; a
  # checklist box was once ticked for a run that never happened.
  specs:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because "Check the change was archived" diffs this branch
      # against its base, and a shallow clone has no merge base to diff from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Parses every master spec: catches residual delta sections,
      # requirements missing SHALL/MUST, requirements with no scenarios,
      # and Purpose blocks that are too brief.
      #
      # The package is @fission-ai/openspec, NOT the unrelated `openspec`
      # stub on npm (v0.0.0, no bin). Locally `npx openspec` appears to
      # work only when the scoped package happens to be installed
      # globally, so the bare name silently fails on a clean runner with
      # "could not determine executable to run". Pinned so a new upstream
      # release cannot redden a PR that changed nothing.
      - name: Validate master specs
        run: npx --yes @fission-ai/openspec@1.13.0 validate --specs --strict

      # Greps for the placeholders `openspec archive` leaves behind when a
      # new capability's Purpose was never written. Runs even if the step
      # above failed, so a broken PR surfaces both problems in one go.
      # `openspec:check` also runs `validate --all`, so this is the step that
      # fails on an invalid active change — the one above covers master specs
      # only. It fails if either gate did (#146).
      - name: Check for TBD placeholders
        if: always()
        run: pnpm openspec:check

      # Which workflows OpenSpec generates is a global, per-machine setting
      # whose default profile includes `explore`, so `openspec update` puts
      # back the agent instructions this repo deliberately dropped — on any
      # machine, and nothing in the resulting diff looks wrong. Deleting the
      # files could not record that decision; this is what records it.
      #
      # Its own step, not a link in `openspec:check`'s chain: the two gates
      # above are about the content of the specs and this one is about files
      # that should not exist, so a red icon here names which of the three
      # fired. `always()` for the same reason as above — a malformed spec must
      # not hide a returning `explore` until the next push.
      - name: Check the generated OpenSpec workflows
        if: always()
        run: pnpm check:openspec-workflows

      # AGENTS.md: archive happens in the branch, before the merge to main —
      # "Do not defer the archive to a follow-up PR". Nothing enforced that.
      # The steps above ask whether a specification is well formed and whether a
      # Purpose is still TBD; neither notices a change that was applied and never
      # archived, which is how the sibling `pinpoint` repository ended up with a
      # master spec stating the opposite of its code for two merges.
      #
      # Reads the pull request body so an unfinished apply can declare itself;
      # see the script for the marker and why it is not spelled "archive later".
      # `always()` for the same reason as the steps above.
      - name: Check the change was archived
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm check:unarchived

  monorepo-health:
    # El nombre del check NO se toca al agregarle un step, por la misma razón
    # documentada arriba en `web-test`: la protección de `main` exige los checks
    # por nombre, y renombrar uno deja al check requerido esperando a alguien que
    # ya no se reporta nunca. Lo que corre está en los steps.
    name: Monorepo health (lockfile + peer dep dedup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is stale relative to
      # any package.json in the workspace. Catches missing lockfile
      # updates from PRs that touched dependencies.
      - name: Validate pnpm-lock.yaml freshness
        run: pnpm install --frozen-lockfile

      # Guards against the bug from 2026-05-19: two React versions in
      # the monorepo crashed the mobile bundle with "Cannot read
      # property 'useRef' of null" inside react-native-screens. See
      # apps/mobile/PROXIMAS_FASES.md for the incident.
      #
      # The rule, and why react-dom is excluded, now live in the script —
      # it was shell here, which meant CI could check it and a person
      # could not, and the PR template had to tell people to paste a jq
      # one-liner instead. `pnpm verify` runs it.
      - name: Detect duplicate critical peer dependencies
        run: pnpm check:duplicate-deps

      # Guards against the bug from issue #131: `pnpm test` was green in CI and
      # red on a developer's machine, on the same commit. The reasoning — why
      # the financial timezone and not UTC, and why the prefix lives in each
      # package rather than at the root — now lives in the script, so that it
      # reaches the person who adds package number 14 rather than only CI.
      - name: Verify every test script pins the financial timezone
        run: pnpm check:test-timezone
