packages:
  - 'apps/*'
  - 'packages/*'

# Required by Expo + React Native in pnpm monorepos.
# RN libraries (Reanimated, nativewind/react-native-css-interop, etc.) resolve
# sibling packages via bare `require()` at Metro-config load time; pnpm's
# default isolated linker breaks those resolutions ("Cannot find module
# 'connect'" when loading metro.config.js). Hoisted gives a flat npm-style
# layout that works for RN and is harmless for Next.
# https://docs.expo.dev/guides/monorepos/#pnpm
#
# This lives HERE and not in `.npmrc`: pnpm 11 no longer reads settings from
# `.npmrc`, so the old entry was silently ignored and installs came out
# isolated. https://pnpm.io/settings
nodeLinker: hoisted

# Consecuencia en Vercel: con `hoisted` NO existe `apps/web/node_modules/next`
# (Next vive solo en el `node_modules` de la raíz). El builder de Vercel corre
# `pnpm run build` con cwd `apps/web` y resuelve el binario en
# `apps/web/node_modules/next/dist/bin/next`, que bajo este layout nunca se
# crea → "Cannot find module .../next/dist/bin/next" y el deploy falla, aunque
# CI pase (CI buildea con `pnpm --filter web build` desde la raíz, donde el
# `.bin` de la raíz sí está en PATH). Por eso `apps/web/vercel.json` sobreescribe
# el buildCommand para correr desde la raíz. Si algún día se vuelve al linker
# isolated, ese override deja de hacer falta.

# Also moved from `.npmrc` for the same reason.
publicHoistPattern:
  - '*eslint*'
  - '*next*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  dtrace-provider: true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
